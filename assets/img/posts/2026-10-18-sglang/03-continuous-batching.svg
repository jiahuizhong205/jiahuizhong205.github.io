<text x="65" y="752" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#172b4d">A 在第 2 轮结束后退出，D 在第 3 轮加入；C 退出后，E 在第 4 轮加入。</text>
<text x="65" y="805" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#526582">无需等到最慢的 B 完成，其他请求就可以开始推进。</text>
<text x="65" y="853" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#526582">仅展示 decode 调度：新请求的 prefill、具体资源预算与调度开销在此省略。</text>
</svg>