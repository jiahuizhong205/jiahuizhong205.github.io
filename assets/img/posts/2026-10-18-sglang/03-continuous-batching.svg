<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="65" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" fill="#172b4d">连续批处理：在迭代之间替换已完成的请求</text>
<text x="60" y="121" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#526582">最多同时处理 3 个请求；每个色块表示该请求在本轮生成一个 token。</text>
<text x="60" y="164" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#526582">输出长度示例：A = 2，B = 5，C = 3，D = 4，E = 2</text>
